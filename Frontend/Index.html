<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS // Cyber_Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cyber-panel">
        <h1>[ SYS.NEXUS_OVERRIDE ]</h1>
        <div class="data-stream">
            <p>CORE_TEMP___: <span id="temp" class="value">--</span> °C</p>
            <p>NET_STATUS__: <span id="status" class="value">--</span></p>
            <p>PROXIES_____: <span id="proxies" class="value">--</span></p>
        </div>
        <div class="scan-line"></div>
    </div>

    <script src="Main.js"></script>
</body>
</html>
